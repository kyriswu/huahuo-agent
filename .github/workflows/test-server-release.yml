name: Test server release

# Protected main reacts to successful test push CI; manual dispatch remains for recovery.
# All runner-side control code and dependencies come from main, never test.
# This does not replace the authenticated release-smoke workflow.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Agent CI]
    types: [completed]
    branches: [test]

permissions:
  contents: read
  actions: read
  id-token: write

# Non-secret repository variables; the caller and OIDC checks enforce fixed targets.
env:
  TEST_RELEASE_REGION_ID: ${{ vars.TEST_RELEASE_REGION_ID }}
  TEST_RELEASE_INSTANCE_ID: ${{ vars.TEST_RELEASE_INSTANCE_ID }}
  TEST_RELEASE_COMMAND_ID: ${{ vars.TEST_RELEASE_COMMAND_ID }}
  TEST_RELEASE_OIDC_PROVIDER_ARN: ${{ vars.TEST_RELEASE_OIDC_PROVIDER_ARN }}
  TEST_RELEASE_ROLE_ARN: ${{ vars.TEST_RELEASE_ROLE_ARN }}

concurrency:
  group: huahuo-agent-test-server-release
  cancel-in-progress: false

jobs:
  release:
    name: Test server deployment acceptance
    if: >-
      github.repository == 'kyriswu/huahuo-agent' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'test' &&
        github.event.workflow_run.head_repository.full_name == 'kyriswu/huahuo-agent'))
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted main control revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.0'
          package-manager-cache: false
      - name: Verify successful test CI and release intent
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/test-release-trigger.mjs
      - name: Install locked caller dependencies
        if: steps.candidate.outputs.deploy == 'true'
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify OIDC claims and dedicated role configuration
        if: steps.candidate.outputs.deploy == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { verifyTestReleaseOidcClaims } from './scripts/release/test-release-source.mjs';
          try {
            if (process.env.TEST_RELEASE_OIDC_PROVIDER_ARN !== 'acs:ram::1883731481145107:oidc-provider/github-actions-huahuo-server' ||
              process.env.TEST_RELEASE_ROLE_ARN !== 'acs:ram::1883731481145107:role/huahuo-agent-test-release') throw new Error();
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'sts.aliyuncs.com');
            const response = await fetch(url, { headers: { authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }, signal: AbortSignal.timeout(10000), redirect: 'error' });
            if (!response.ok) throw new Error();
            const token = (await response.json()).value;
            if (typeof token !== 'string' || token.length > 20000 || token.split('.').length !== 3) throw new Error();
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            verifyTestReleaseOidcClaims(claims, process.env.GITHUB_SHA, process.env.GITHUB_EVENT_NAME);
            console.log('Dedicated test environment and main OIDC claims verified.');
          } catch {
            console.error('::error::TEST_RELEASE_OIDC_NOT_VERIFIED');
            process.exit(1);
          }
          NODE
      - name: Obtain temporary test-server credentials
        if: steps.candidate.outputs.deploy == 'true'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ env.TEST_RELEASE_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.TEST_RELEASE_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 5400
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Invoke the fixed saved test-server command
        if: steps.candidate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/test-release-source.mjs
          node scripts/release/invoke-cloud-release.mjs
