name: Publish Agent image to Alibaba Cloud ACR

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full SHA at the head of test with a successful push Agent CI run
        required: true
        type: string
    secrets:
      AGENT_REGISTRY_USERNAME:
        required: true
      AGENT_REGISTRY_PASSWORD:
        required: true
    outputs:
      image_digest:
        description: Registry digest for the published image
        value: ${{ jobs.publish-image.outputs.image_digest }}

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: huahuo-agent-image
  cancel-in-progress: false

jobs:
  verify-source:
    if: github.repository == 'kyriswu/huahuo-agent' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      image_repository: ${{ steps.candidate.outputs.image_repository }}
      registry: ${{ steps.candidate.outputs.registry }}
      platform: ${{ steps.candidate.outputs.platform }}
      runner: ${{ steps.candidate.outputs.runner }}
    steps:
      - name: Checkout trusted main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.0'
          package-manager-cache: false
      - name: Verify the exact tested source and image configuration
        id: candidate
        env:
          AGENT_IMAGE_SOURCE_SHA: ${{ inputs.source_sha }}
          AGENT_IMAGE_REPOSITORY: ${{ vars.AGENT_IMAGE_REPOSITORY }}
          AGENT_IMAGE_PLATFORM: ${{ vars.AGENT_IMAGE_PLATFORM }}
          AGENT_ACR_BUILD_RUNNER: ${{ vars.AGENT_ACR_BUILD_RUNNER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/kubernetes/agent-image-source.mjs

  publish-image:
    needs: verify-source
    runs-on: ${{ needs.verify-source.outputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
      IMAGE_REPOSITORY: ${{ needs.verify-source.outputs.image_repository }}
      REGISTRY: ${{ needs.verify-source.outputs.registry }}
      IMAGE_PLATFORM: ${{ needs.verify-source.outputs.platform }}
    steps:
      - name: Checkout verified Agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false
      - name: Verify checked-out revision and runner architecture
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$IMAGE_PLATFORM:$(uname -s):$(uname -m)" in
            linux/amd64:Linux:x86_64 | linux/arm64:Linux:aarch64) ;;
            *) echo '::error::AGENT_ACR_BUILD_RUNNER_PLATFORM_MISMATCH'; exit 1 ;;
          esac
      - name: Build and publish the Studio-enabled Agent image to ACR
        id: publish
        env:
          REGISTRY_USERNAME: ${{ secrets.AGENT_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.AGENT_REGISTRY_PASSWORD }}
        run: |
          : "${REGISTRY_USERNAME:?Configure AGENT_REGISTRY_USERNAME}"
          : "${REGISTRY_PASSWORD:?Configure AGENT_REGISTRY_PASSWORD}"
          scratch=$(mktemp -d "$RUNNER_TEMP/agent-image.XXXXXX")
          builder="huahuo-agent-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export DOCKER_CONFIG="$scratch/docker"
          cleanup() {
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          install -d -m 0700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          unset REGISTRY_USERNAME REGISTRY_PASSWORD
          metadata="$scratch/metadata.json"
          docker buildx create --name "$builder" --driver docker-container
          docker buildx build --builder "$builder" --platform "$IMAGE_PLATFORM" \
            --build-arg MASTRA_BUILD_STUDIO=true \
            --tag "$IMAGE_REPOSITORY:$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --annotation "manifest:org.opencontainers.image.revision=$SOURCE_SHA" \
            --metadata-file "$metadata" --push .
          digest=$(jq -er '."containerimage.digest" | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' "$metadata")
          printf 'image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '## Agent image\n\n- Source commit `%s`\n- Platform `%s`\n- Image `%s@%s`\n' \
            "$SOURCE_SHA" "$IMAGE_PLATFORM" "$IMAGE_REPOSITORY" "$digest" >> "$GITHUB_STEP_SUMMARY"
