apiVersion: apps/v1
kind: Deployment
metadata:
  name: huahuo-agent
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: arm64
      initContainers:
        - name: preflight
          env:
            - name: APP_ENV
              value: production
      containers:
        - name: agent
          env:
            - name: APP_ENV
              value: production
            - name: HUAHUO_STUDIO_AUTH_ENABLED
              value: "false"
